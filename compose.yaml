# graph-mcp in a container. Your settings go into `.env` next to this file; changes of your own into a
# `compose.override.yaml`, which Compose merges in.
#
#   echo "GRAPH_MCP_CLIENT_ID=<your app's client id>" > .env
#   echo "GRAPH_MCP_TOKEN=$(openssl rand -hex 32)" >> .env
#   echo "GRAPH_MCP_BIND=<this machine's address on your clients' network>" >> .env
#   echo "TZ=America/New_York" >> .env        # your time zone, for every date shown and given
#   chmod 600 .env
#   docker compose build
#   docker compose run --rm graph login       # once: enter the code at microsoft.com/devicelogin
#                                             # (if it's rejected: browser sign-in + copy, README step B3)
#   docker compose up -d
#   docker compose ps                         # "healthy" only while there's a sign-in
#
# Clients connect to http://<GRAPH_MCP_BIND>:8766/mcp with "Authorization: Bearer <token>". Anyone with the token
# can read your mail: bind to an address on your own network or VPN only, never a public one. It's plain HTTP:
# use a VPN, or a TLS proxy in front, outside a network you trust.
services:
  graph:
    build: .
    image: graph-mcp:latest
    restart: unless-stopped
    environment:
      GRAPH_MCP_CLIENT_ID: ${GRAPH_MCP_CLIENT_ID:?set GRAPH_MCP_CLIENT_ID in .env}
      GRAPH_MCP_TENANT: ${GRAPH_MCP_TENANT:-consumers}
      GRAPH_MCP_TOKEN: ${GRAPH_MCP_TOKEN:?set GRAPH_MCP_TOKEN in .env}
      GRAPH_MCP_PORT: ${GRAPH_MCP_PORT:-8766}
      GRAPH_MCP_TIMEZONE: ${TZ:-Etc/UTC}
      TZ: ${TZ:-Etc/UTC}
    ports:
      # Required: publish on one address only, never on every interface.
      - "${GRAPH_MCP_BIND:?set GRAPH_MCP_BIND in .env to this machine's address on your clients' network}:${GRAPH_MCP_PORT:-8766}:${GRAPH_MCP_PORT:-8766}"
    volumes:
      # The sign-in (token cache, mode 0600). It holds a refresh token: anyone who can read the volume can read mail.
      - graph-data:/data
    read_only: true
    tmpfs:
      # Scratch space for the document converters' libraries; files themselves are converted in memory.
      - /tmp:uid=1000,gid=1000,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g

volumes:
  graph-data:
